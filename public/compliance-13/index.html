{title:'灰色交易，不能搭桥',rule:'禁止参与各类违法犯罪活动',clock:'10:15',place:'午前来电',speaker:'朋友阿凯',quote:'“帮我过几笔账，不用问资金来源。大家都这么做，给你辛苦费。”',thought:'看似帮朋友周转，可能让自己卷入洗钱、诈骗或赌博等犯罪链条。',prop:'🚫',color:'#b8b4f6',options:[['借出个人账户，不参与后续操作','出借账户为来历不明的资金过账，风险极高。'],['拒绝参与，不提供账户或其他协助，必要时报告','遇到明显异常的资金活动，应拒绝协助并遵守相关报告规定。'],['请对方先转少量资金测试','所谓“测试”也可能是参与违法资金流转。']],correct:1,lesson:'不能参与或协助洗钱、赌博、传销及其他违法犯罪活动。'},
{title:'银行名义不是私人担保',rule:'禁止擅用本行名义签订借款合同或担保',clock:'10:50',place:'会议室',speaker:'企业客户',quote:'“我知道你们不方便正式出函，能不能先盖个业务部门的章，帮我给合作伙伴吃颗定心丸？”',thought:'即使只是“帮忙证明”，带有银行名义的文件也有法律风险。',prop:'📜',color:'#c6e2c3',options:[['只签自己的名字，不代表银行','以银行员工或机构身份出具不当承诺仍可能造成误导和风险。'],['用旧版公函模板，写明不具法律效力','非授权出具银行名义文件依然不可取。'],['拒绝擅自出具，告知走正式授权审批渠道','涉及银行名义、信用、承诺和担保的文件必须合规授权。']],correct:2,lesson:'不得未经授权借本行名义签约、担保或出具具有信用和法律后果的文件。'},
{title:'一张空白凭证',rule:'禁止伪造、擅自印制、套用重要空白凭证',clock:'11:30',place:'柜面后台',speaker:'业务搭档',quote:'“重要凭证今天不够用，先把这张扫描件打印出来顶一下，客户赶时间。”',thought:'重要空白凭证、印章都必须在受控流程中使用。',prop:'📑',color:'#f8d3a9',options:[['拒绝自行复制，按凭证管理办法补领或处理','只有受控、授权的凭证和印章管理流程才能保障真实性。'],['复印一张，事后销毁就好','私印、套用重要凭证可能造成严重操作及法律风险。'],['借其他同事的印章先完成','擅借、挪用印章同样会突破管理红线。']],correct:0,lesson:'不得伪造、擅自印制或套用重要空白凭证，也不得私刻、盗用和出借印章。'},
{title:'高佣金的“飞单”',rule:'禁止销售非本行金融产品或私自代客理财',clock:'13:15',place:'客户咨询室',speaker:'第三方销售',quote:'“这款产品比行里的收益高得多，你介绍客户给我，成交就分佣金。”',thought:'客户相信的可能是你作为银行员工的身份，而非产品本身。',prop:'📈',color:'#b7e1da',options:[['先替对方收集客户意向，自己不签合同','为外部产品引流、推介仍可能构成违规“飞单”。'],['拒绝私下推介和分佣，按本行合规渠道提供服务','金融产品营销应遵守适当性、销售资质和渠道管理要求。'],['只对高净值熟客介绍，风险他们自担','客户风险自担不能免除员工违规销售责任。']],correct:1,lesson:'不得借银行身份私售非本行金融产品或擅自代客户投资理财。'},
{title:'一张截图也可能泄密',rule:'禁止盗取、泄露、传播客户或银行机密信息',clock:'14:05',place:'手机弹出消息',speaker:'外部朋友',quote:'“你把那位客户的资产截图发我，我就是了解下，不会外传的。”',thought:'“只发给一个人”也可能造成客户信息泄露。',prop:'🔐',color:'#a1c5f8',options:[['遮住姓名后，把完整交易明细发过去','其他信息组合也可能识别客户，且缺乏业务授权。'],['在私人聊天里只发一次','私人聊天不等于合规的信息传输渠道。'],['拒绝提供，客户信息仅在授权目的与受控系统中使用','遵守最小必要、授权访问和保密要求。']],correct:2,lesson:'不得擅自获取、传播或买卖客户信息和本行商业秘密。'},
{title:'合作不能走“暗门”',rule:'禁止与供应商、中介等开展违规利益往来',clock:'14:45',place:'供应商洽谈',speaker:'服务商负责人',quote:'“你帮我绕开招采比较，我给你一笔顾问费，合作还能更快落地。”',thought:'违规合作和个人利益交换，破坏业务公正。',prop:'🤝',color:'#f8c1bf',options:[['拒绝私下利益安排，按公开规范流程推进合作','供应商及中介合作必须合规，注意回避不当利益输送。'],['拿到顾问费后，不参与正式审批','不参与审批也不等于可以私下收取业务相关利益。'],['让对方把费用转给朋友','通过关联人代收仍无法消除不当利益关系。']],correct:0,lesson:'与供应商、中介等合作应遵守采购与业务管理要求，不得搞利益输送或违规操作。'},
{title:'不能跳过的那一步',rule:'禁止越权、逆程序、“一手清”办理业务',clock:'15:20',place:'业务审批岗',speaker:'急办客户',quote:'“流程太慢了，你一个人先办完吧，审批材料稍后再补。”',thought:'速度不能替代授权与岗位制衡。',prop:'⏱️',color:'#eac6fd',options:[['熟客业务可先办后补','业务紧急或客户熟悉也不能替代必要审批。'],['坚守权限边界，按岗位分离与审批流程办理','按授权、复核及业务制度开展操作，避免一人包办。'],['分两次操作，系统里不容易发现','拆分绕过控制属于更严重的违规风险。']],correct:1,lesson:'不得越权、逆程序或绕过必要的授权、复核和岗位制衡要求。'},
{title:'“出了事我负责”',rule:'禁止强令、指使、暗示他人违规操作',clock:'16:10',place:'办公室内',speaker:'上级同事',quote:'“你就按我的意思改一下业务资料，出了问题我来负责。”',thought:'指令来自谁，都不能改变违规行为本身。',prop:'🗣️',color:'#f6ce94',options:[['按要求操作，留下聊天记录就好','保留证据不代表可以执行明显违规指令。'],['让新人代操作，自己不经手','转嫁违规操作不符合履职责任。'],['明确提出合规异议，拒绝违规指令并循适当渠道反映','面对指使或暗示违规，应坚持制度并按规定报告。']],correct:2,lesson:'不得强令、指使、暗示他人违规，也不能因压力而执行明显违规操作。'},
{title:'好心代管的隐患',rule:'禁止违规保管客户及重要物品',clock:'16:50',place:'贵宾客户室',speaker:'老客户王阿姨',quote:'“孩子不在身边，你帮我保管银行卡、密码纸和印章吧，我最信任你。”',thought:'客户的信任更需要通过规范服务来保护。',prop:'💳',color:'#b9dbf4',options:[['婉拒代管，为客户说明安全保管及正规服务渠道','不得擅自替客户保管卡、折、印章等重要物品。'],['只保管卡片，密码纸交同事','分开存放不能使违规代管合法。'],['放到柜子里上锁，承诺不使用','私自代管即使没有实际使用也存在违规风险。']],correct:0,lesson:'不能违规代客户保管银行卡、存单、印章、身份证件等重要物品。'},
{title:'最后一道防线',rule:'禁止违规资金过渡与银行卡虚假套现',clock:'17:40',place:'下班前的电话',speaker:'熟人客户',quote:'“能帮忙用 POS 机刷几笔假交易提现吗？手续费可以给你多一点。”',thought:'业务结束前，更要守住资金与信用卡交易的真实性。',prop:'💸',color:'#ffc8a2',options:[['客户自愿，帮忙操作一次就行','客户同意不意味着虚假套现交易合规。'],['拒绝协助虚假交易和违规套现，提示正规途径','交易必须真实，不得组织或协助套现、空存空取及违规资金过渡。'],['改用其他人账户操作以避免关联','借用他人账户只会扩大违规与资金风险。']],correct:1,lesson:'不得空存空取、借客户或他人账户违规过渡资金，不得组织或协助虚假交易套现。'}
];
const STORE='thirteen_lines_h5_v1';
let state={screen:'home',index:0,score:0,answers:[],selection:null};
function save(){try{localStorage.setItem(STORE,JSON.stringify({index:state.index,score:state.score,answers:state.answers,screen:state.screen}))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&Array.isArray(v.answers)&&v.answers.length<=13){state.answers=v.answers.filter(n=>Number.isInteger(n));state.index=Math.min(12,state.answers.length);state.score=state.answers.filter((a,i)=>a===DATA[i]?.correct).length;state.screen=state.answers.length===13?'result':'home';state.selection=null}}catch(e){}}

function catalog(){return `<details class="catalog"><summary>查看 13 类合规风险目录 <span>＋</span></summary><ol>${DATA.map(d=>`<li>${escapeHTML(d.rule)}</li>`).join('')}</ol></details>`}
function home(){let resume=state.answers.length>0 && state.answers.length<13;return `<section class="paper home"><div class="home-left"><div class="eyebrow"><i></i> INTERACTIVE COMIC · 合规情景体验</div><h1>十三道<em>防线</em></h1><span class="english">THE LINE / MAKE THE RIGHT CALL</span><p class="lead">一天的工作，十三次抉择。<br>当人情、业绩和“方便”撞上制度，你会如何选择？</p><div class="statrow"><div class="stat"><strong>13</strong><small>类禁令情景</small></div><div class="stat"><strong>3</strong><small>种选择路线</small></div><div class="stat"><strong>1</strong><small>条不能越过的线</small></div></div><div class="introbtns"><button class="primary" id="start">${resume?'继续闯关':'进入合规微剧场'} →</button>${resume?'<button class="resume" id="new-game">从第一关开始</button>':''}</div><p class="below">单人体验 · 约 5–8 分钟 · 全程无需登录 · 不收集个人数据</p>${catalog()}</div><div class="home-right"><div class="cornerflag">原创 · 互动教育作品</div><div class="burst">13 个<br>考验！</div><div class="home-art"><div class="cover-frame">${art({prop:'🛡️',color:'#b6d9fb'},true)}</div></div><div class="comic-label">“真正的守护，是关键时刻不越线。”</div></div></section>`}
function dots(){return `<div class="chapterdot" aria-label="十三关完成情况">${DATA.map((d,i)=>`<i title="第${i+1}关" class="${i<state.answers.length?(state.answers[i]===d.correct?'done':'miss'):(i===state.index?'active':'')}"></i>`).join('')}</div>`}
function game(){let d=DATA[state.index],s=state.selection;let answered=s!==null;let win=answered && s===d.correct;return `<section class="paper game"><div class="game-top"><div class="topcap"><span class="chapter">CHAPTER ${String(state.index+1).padStart(2,'0')}</span><span>员工行为 · 合规情景模拟</span></div><div class="scorebox">当前守线 <strong>${state.score}</strong> / ${state.answers.length} 关</div></div><div class="progress-wrap"><div class="progress-meta"><span>你的合规防线正在建立</span><span>${state.index+1} / 13</span></div><div class="track"><div class="fill" style="width:${(state.index+1)/13*100}%"></div></div></div><div class="board"><div class="storycol"><div class="storytime"><span>◷ ${d.clock} · ${escapeHTML(d.place)}</span><span>情景 ${String(state.index+1).padStart(2,'0')}</span></div><div class="scene-frame"><div class="scene-lbl">${escapeHTML(d.title)}</div>${art(d)}</div><div class="storybox"><div class="story-name">● ${escapeHTML(d.speaker)} 说</div><div class="storytext">${escapeHTML(d.quote)}</div></div><div class="thought">🔎 <b>风险观察：</b>${escapeHTML(d.thought)}</div></div><div class="choicecol"><div class="pill">◈ 禁令主题 · 第 ${state.index+1} 类风险</div><h2>此刻，你怎么做？</h2><p class="q-sub">选择一个处理方式。每一道选择，都决定这条合规防线是否稳固。</p><div class="optiongrid">${d.options.map((o,i)=>`<button type="button" data-choice="${i}" class="option ${answered?(i===d.correct?'correct':i===s?'wrong':''):''}" ${answered?'disabled':''} aria-label="选项${'ABC'[i]}，${escapeHTML(o[0])}"><span class="letter">${'ABC'[i]}</span><span class="opttext">${escapeHTML(o[0])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${win?'':'bad'}" role="status"><div class="feedback-head">${win?'✅ 守线成功！':'⚠️ 发现风险，及时纠偏'}</div><p>${escapeHTML(d.options[s][1])}</p>${!win?`<p><strong>建议选择：</strong>${escapeHTML(d.options[d.correct][0])}</p>`:''}<p><strong>本关守则：</strong>${escapeHTML(d.lesson)}</p></div><button type="button" class="primary next" id="next">${state.index===12?'查看我的守线报告':'进入下一道防线'} →</button>`:''}${dots()}</div></div></section>`}
function level(){let s=state.score;if(s===13)return ['零越线守护者','十三道防线，全数守住。你展现了稳定的风险识别与合规判断。','🏆'];if(s>=10)return ['合规先锋','绝大多数关键时刻，你做出了正确决定。再复盘薄弱环节。','🛡️'];if(s>=7)return ['成长中的守线人','你已经识别多项风险，仍有几道防线值得再次练习。','🧭'];return ['红线观察员','合规需要持续训练。逐条复盘，再重新挑战十三道防线。','📚']}
function result(){let [name,desc,medal]=level();let errors=state.answers.map((a,i)=>a===DATA[i].correct?null:i).filter(x=>x!==null);return `<section class="paper results"><div class="result-layout"><div class="certificate"><div class="float-confetti">${Array.from({length:16},(_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${i*.31}s;background:${['#ffc75e','#6edfc4','#f28b80','#a8c4fa'][i%4]}"></i>`).join('')}</div><div class="cert-top">THE LINE · COMPLIANCE CHALLENGE</div><div class="cert-icon">${medal}</div><div class="cert-level">${name}</div><div class="cert-desc">${escapeHTML(desc)}</div><div class="cert-score">${state.score}<span> / 13</span></div><div class="cert-bottom">员工行为十三条禁令 · 互动学习纪念卡<br>合规不是口号，而是每一次具体选择。</div></div><div><div class="eyebrow"><i></i> CHALLENGE COMPLETED</div><h2 class="result-title">十三道防线，<br>你守住了 ${state.score} 道。</h2><p class="result-text">你的十三次选择已经记录在本设备中。回顾每一道防线，尤其留意容易被“人情”和“效率”模糊的判断。</p><div class="breakdown"><div class="metric"><b>${state.score}</b><small>成功识别并守线</small></div><div class="metric"><b>${errors.length}</b><small>建议重点复盘</small></div></div><div class="review"><h3>13 道防线 · 复盘目录</h3><div class="review-list">${DATA.map((d,i)=>`<div class="review-item"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${escapeHTML(d.rule)}${state.answers[i]!==d.correct?`<div style="margin-top:6px;color:#b3554e">提示：${escapeHTML(d.lesson)}</div>`:''}</span><span class="tick ${state.answers[i]===d.correct?'':'no'}">${state.answers[i]===d.correct?'✓':'×'}</span></div>`).join('')}</div></div><div class="actions"><button class="primary" id="savecard">保存纪念卡 ↓</button><button class="primary secondary" id="again">再玩一次 ↺</button><button class="primary secondary" id="copy-result">复制成绩</button></div><p class="sourcenote">纪念卡是本地生成的图片，非培训合格证书。完整制度请以兴业银行现行正式文本为准。</p></div></div></section>`}
function render(){const app=document.getElementById('app');app.innerHTML=state.screen==='home'?home():state.screen==='game'?game():result();document.title=(state.screen==='game'?`第${state.index+1}关 · `:'')+'十三道防线｜合规互动微剧场';if(state.screen==='home'){document.getElementById('start').onclick=()=>{state.screen='game';state.index=state.answers.length;state.selection=null;save();render()};let ng=document.getElementById('new-game');if(ng)ng.onclick=restart}else if(state.screen==='game'){document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>select(Number(el.dataset.choice)));let next=document.getElementById('next');if(next)next.onclick=advance}else{document.getElementById('again').onclick=restart;document.getElementById('savecard').onclick=downloadCard;document.getElementById('copy-result').onclick=copyResult}window.scrollTo({top:0,behavior:'instant'})}
function select(i){if(state.selection!==null || ![0,1,2].includes(i))return;state.selection=i;const d=DATA[state.index];state.answers.push(i);if(i===d.correct)state.score++;save();render()}
function advance(){if(state.selection===null)return;if(state.index>=12){state.screen='result';state.selection=null}else{state.index++;state.selection=null}save();render()}
function restart(){state={screen:'game',index:0,score:0,answers:[],selection:null};save();render()}
function copyResult(){let [n]=level(),msg=`我完成了《十三道防线》互动合规挑战：${state.score}/13 道守线成功，获得「${n}」称号。`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>{let b=document.getElementById('copy-result');b.textContent='已复制 ✓';setTimeout(()=>{if(b)b.textContent='复制成绩'},1500)}).catch(()=>fallbackCopy(msg))}else fallbackCopy(msg)}
function fallbackCopy(s){let e=document.createElement('textarea');e.value=s;document.body.appendChild(e);e.select();let ok=document.execCommand('copy');e.remove();if(ok){let b=document.getElementById('copy-result');if(b)b.textContent='已复制 ✓'}else alert(s)}
function downloadCard(){let c=document.createElement('canvas');c.width=1000;c.height=1400;let ctx=c.getContext('2d');if(!ctx){alert('当前浏览器不支持图片导出');return}const W=1000,H=1400;ctx.fillStyle='#101e44';ctx.fillRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,1000,1400);grad.addColorStop(0,'#244da3');grad.addColorStop(1,'#0a1430');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#f5c771';ctx.lineWidth=7;ctx.strokeRect(40,40,920,1320);ctx.strokeStyle='rgba(255,255,255,.15)';ctx.strokeRect(56,56,888,1288);ctx.fillStyle='#e4ecfc';ctx.font='bold 29px system-ui, sans-serif';ctx.textAlign='center';ctx.fillText('THE LINE   /   COMPLIANCE CHALLENGE',500,166);ctx.fillStyle='#f6c665';ctx.font='900 96px system-ui, sans-serif';ctx.fillText('十三道防线',500,335);ctx.fillStyle='#eaf2ff';ctx.font='bold 39px system-ui, sans-serif';ctx.fillText('员工行为十三条禁令 · 互动合规微剧场',500,404);ctx.fillStyle='#f7c76e';ctx.font='900 190px system-ui, sans-serif';ctx.fillText(String(state.score).padStart(2,'0'),500,690);ctx.font='bold 33px system-ui, sans-serif';ctx.fillStyle='#d9e5fb';ctx.fillText('/ 13  道防线',500,760);ctx.fillStyle='#f4cb7d';ctx.font='900 54px system-ui, sans-serif';ctx.fillText(level()[0],500,895);ctx.font='30px system-ui, sans-serif';ctx.fillStyle='#f5f0e6';ctx.fillText('守住合规底线  ·  维护金融安全',500,992);ctx.fillStyle='#b1c4e8';ctx.font='26px system-ui, sans-serif';ctx.fillText('每一次选择，都是对职业底线的守护。',500,1057);ctx.beginPath();ctx.moveTo(160,1160);ctx.lineTo(840,1160);ctx.strokeStyle='#8c9fbd';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#c8d7ef';ctx.font='24px system-ui, sans-serif';ctx.fillText('原创互动学习纪念卡 · 非正式认证证明',500,1233);try{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='十三道防线_合规纪念卡.png';document.body.appendChild(a);a.click();a.remove()}catch(err){alert('此浏览器暂不支持直接保存图片，请使用截图保存。')}}
document.getElementById('brand').onclick=e=>{e.preventDefault();state.screen='home';state.selection=null;save();render()};document.getElementById('reset-top').onclick=()=>{if(confirm('确认重新开始？当前闯关记录将清空。'))restart()};document.addEventListener('keydown',e=>{if(state.screen==='game'&&/^[123]$/.test(e.key)&&state.selection===null){select(Number(e.key)-1)}else if(state.screen==='game'&&e.key==='Enter'&&state.selection!==null&&!e.repeat){advance()}});
load();render();
</script>
</body>
